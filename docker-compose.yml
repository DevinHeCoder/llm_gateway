services:
  # LLM 网关（代理云端 LLM API：OpenAI 兼容协议，DeepSeek / 通义 DashScope 等）
  gateway:
    build: .
    ports:
      - "8003:9000"
    environment:
      # 推理后端：openai_compatible（云端 OpenAI 兼容 API），不依赖本地 GPU
      - GATEWAY_MODEL_PROVIDER=openai_compatible
      - GATEWAY_MODEL_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
      - GATEWAY_MODEL_API_KEY=${GATEWAY_MODEL_API_KEY}
      - GATEWAY_MODEL_DEFAULT=qwen3-max
      - GATEWAY_RATE_LIMIT_PROVIDER=redis
      - GATEWAY_REDIS_URL=redis://redis:6379/0
      - GATEWAY_CACHE_PROVIDER=redis
      - GATEWAY_CACHE_TTL_SECONDS=3600
      - GATEWAY_CONCURRENCY_PROVIDER=semaphore
      - GATEWAY_CONCURRENCY_MAX_CONCURRENT=10
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped

  # Redis（缓存 + 分布式限流）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:

# 网络：默认本地自建；部署到与 rag/agent 同机时，在 .env 设
# GATEWAY_NETWORK=rag_engine_default 即可让 nginx 反代到 gateway 容器名
networks:
  default:
    name: ${GATEWAY_NETWORK:-llm_gateway_default}
