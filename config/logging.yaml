version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/gateway.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

root:
  level: INFO
  handlers:
    - console
    - file

loggers:
  uvicorn:
    level: INFO
    handlers:
      - console
    propagate: false
  httpx:
    level: WARNING
    handlers:
      - console
    propagate: false
  gateway:
    level: DEBUG
    handlers:
      - console
      - file
    propagate: false
